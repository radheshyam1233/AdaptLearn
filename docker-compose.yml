# docker-compose.yml
# One command starts PostgreSQL, Redis and the API:  docker compose up --build
# Only the databases (for local development):        docker compose up -d db redis

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: adaptlearn
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data      # data survives restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      # Inside Docker, services reach each other by service name, not localhost
      DATABASE_URL: postgresql://postgres:postgres@db:5432/adaptlearn
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-local-docker-secret-change-me-0123456789}
      CORS_ORIGINS: http://localhost:5173
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy           # wait until Postgres accepts connections
      redis:
        condition: service_started

volumes:
  pgdata:
